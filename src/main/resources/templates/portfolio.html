<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>Portfolio</title>
</head>
<body>
<main layout:fragment="body">
    <div class="container d-flex flex-column align-items-center justify-content-center text-white">
        <h2 class="mb-5">PORTFOLIO</h2>

        <div class="table-responsive w-50">
            <table class="table table-bordered text-white">
                <thead>
                <tr>
                    <th>Ticker</th>
                    <th>Amount</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="entry : ${portfolio.stocks}">
                    <td th:text="${entry.key}">Ticker</td>
                    <td th:text="${entry.value}">Amount</td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="mt-4">
            <a href="/portfolio/createPortfolio" class="btn btn-primary">Add New Stock</a>
        </div>
    </div>
</main>
</body>
</html>
